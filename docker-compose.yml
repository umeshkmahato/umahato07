services:
  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile
    ports:
      - "8761:8761"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userapp
      POSTGRES_PASSWORD: userapp
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userapp -d userdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  profile-score-service:
    image: node:20-alpine
    command: >
      sh -c "node -e \"require('http').createServer((req,res)=>{if(req.url.startsWith('/profile-score/')){res.writeHead(200,{'Content-Type':'text/plain'});res.end('77');}else{res.writeHead(404);res.end('0');}}).listen(8090,'0.0.0.0')\""
    ports:
      - "8090:8090"

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      USER_DB_URL: jdbc:postgresql://postgres:5432/userdb
      USER_DB_USERNAME: userapp
      USER_DB_PASSWORD: userapp
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8081:8081"

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      user-service:
        condition: service_started
      profile-score-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROFILE_SCORE_URL: http://profile-score-service:8090/profile-score/{userId}
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      user-service:
        condition: service_started
      agent-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      JWT_ISSUER: umahato-auth
      JWT_AUDIENCE: umahato-api
      JWT_SECRET: umahato-dev-secret-key-please-change-12345
    ports:
      - "8080:8080"
